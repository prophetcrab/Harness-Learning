[project]
name = "p4-harness"
version = "0.4.0"
description = "P4：async-first 插件内核（Context / 插件协议 / 引导）"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 当前只有 core（框架 + 引导）；插件由使用方的 catalog 提供。
include = ["core*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle、F pyflakes、I import 排序、UP pyupgrade、B bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # 行长由 line-length 约束，不逐行报
    "B008",   # 允许在默认参数里调用（如 Field(...)）
]

[tool.ruff.lint.isort]
known-first-party = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
