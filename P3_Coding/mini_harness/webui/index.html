<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3 mini harness · 插件化内核可见性</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161920; --panel-2:#1d2129; --line:#272c36;
    --fg:#e6e8ec; --muted:#9aa3b2; --accent:#6ea8fe; --ok:#4ade80;
    --warn:#fbbf24; --err:#f87171; --pend:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);
    border-radius:99px;padding:2px 9px}
  main{display:grid;grid-template-columns:240px 1fr 400px;gap:0;height:calc(100vh - 55px)}
  .col{border-right:1px solid var(--line);overflow-y:auto;padding:14px}
  .col:last-child{border-right:none}
  .col h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 0 10px}
  .item{padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent}
  .item:hover{background:var(--panel-2)}
  .item.active{background:var(--panel-2);border-color:var(--accent)}
  .item .sub{color:var(--muted);font-size:12px}
  .plug{display:flex;justify-content:space-between;gap:8px;padding:5px 0;
    border-bottom:1px dashed var(--line)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:7px}
  .dot.active{background:var(--ok)} .dot.pending{background:var(--pend)}
  .dot.failed{background:var(--err)}
  .mono{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:12px}
  .msg{margin-bottom:12px;padding:9px 11px;border-radius:8px;background:var(--panel);
    border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .msg .who{font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.05em}
  .msg.user{background:#1a2233;border-color:#274066}
  .msg.tool{background:#1c1f17;border-color:#3a4227}
  .msg.system{background:#171a24}
  .msg.tool .who{color:var(--warn)}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);
    position:sticky;bottom:0;background:var(--bg)}
  input[type=text]{flex:1;background:var(--panel-2);border:1px solid var(--line);
    color:var(--fg);padding:9px 11px;border-radius:8px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#08111f;border:none;border-radius:8px;
    padding:9px 15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .ev{padding:3px 0;border-bottom:1px solid #1b1f27;display:flex;gap:8px}
  .ev .seq{color:var(--muted);min-width:34px;text-align:right}
  .ev .ty{color:var(--accent)}
  .ev.sys .ty{color:var(--warn)}
  .empty{color:var(--muted);font-size:13px;padding:8px 2px}
  .banner{margin:0 0 10px;padding:8px 10px;border-radius:8px;font-size:12px;
    background:#1c1f17;border:1px solid #3a4227;color:var(--warn);display:none}
  .status{font-size:12px;color:var(--muted);padding:0 2px 8px;min-height:18px}
  .tools{color:var(--muted);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>mini harness <span class="tag">P3 · 完全插件化</span></h1>
  <span class="tag" id="url-tag">…</span>
  <span class="tag" id="tools-tag">工具面 …</span>
  <span class="tag" id="svc-tag">服务 …</span>
</header>

<main>
  <section class="col">
    <h2>插件台账</h2>
    <div id="plugins"></div>
    <h2 style="margin-top:18px">会话</h2>
    <div id="sessions"></div>
    <button id="new-session" style="margin-top:10px;width:100%">＋ 新会话</button>
  </section>

  <section class="col" style="display:flex;flex-direction:column;padding:0">
    <div style="flex:1;overflow-y:auto;padding:14px">
      <div class="banner" id="banner"></div>
      <div class="status" id="status"></div>
      <div id="chat"><div class="empty">选一个会话，或点"新会话"开始对话。</div></div>
    </div>
    <form id="composer">
      <input type="text" id="text" placeholder="输入消息…（Enter 发送）" autocomplete="off">
      <button type="submit" id="send">发送</button>
    </form>
  </section>

  <section class="col">
    <h2>事件流 <span class="mono" id="seq-tag" style="float:right"></span></h2>
    <div id="events"><div class="empty">选一个会话后显示它的 append-only 事件。</div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let current = null;      // 当前会话 id
let sending = false;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

// ---------- 台账 ----------
async function loadLedger() {
  const data = await api("/api/ledger");
  $("url-tag").textContent = location.host;
  $("tools-tag").textContent = `工具面 ${data.tools.length}：${data.tools.join(" · ")}`;
  $("svc-tag").textContent = `服务：${data.services.join(" · ")}`;
  $("plugins").innerHTML = data.plugins.map((p) => `
    <div class="plug">
      <span><span class="dot ${p.status}"></span>${p.name}</span>
      <span class="mono" style="color:var(--muted)">${p.inject.length ? "← " + p.inject.join(",") : ""}</span>
    </div>`).join("");
}

// ---------- 会话 ----------
async function loadSessions() {
  const data = await api("/api/sessions");
  if (!data.sessions.length) {
    $("sessions").innerHTML = `<div class="empty">还没有会话。</div>`;
    return;
  }
  $("sessions").innerHTML = data.sessions.map((s) => `
    <div class="item ${s.id === current ? "active" : ""}" data-id="${s.id}">
      <div>${s.id}</div>
      <div class="sub">${s.turns} 个 turn · seq ${s.last_seq}${s.last_status ? " · " + s.last_status : ""}</div>
    </div>`).join("");
  document.querySelectorAll("#sessions .item").forEach((el) => {
    el.onclick = () => openSession(el.dataset.id);
  });
}

async function openSession(id) {
  const switched = current !== id;
  current = id;
  $("banner").style.display = "none";
  if (switched) $("status").textContent = "";  // 切换会话才清状态；刷新同会话保留 turn 结果
  const data = await api(`/api/sessions/${encodeURIComponent(id)}/events`);
  renderMessages(data.messages);
  renderEvents(data.events);
  $("seq-tag").textContent = data.events.length ? `seq ≤ ${data.events.at(-1).seq}` : "";
  await loadSessions();
}

function renderMessages(messages) {
  if (!messages.length) {
    $("chat").innerHTML = `<div class="empty">这个会话还没有消息。</div>`;
    return;
  }
  $("chat").innerHTML = messages.map((m) => `
    <div class="msg ${m.role}">
      <div class="who">${m.role}${m.tools.length ? " · 调用 " + m.tools.join(", ") : ""}</div>
      ${escapeHtml(m.content || (m.tools.length ? "（申请工具调用）" : ""))}
    </div>`).join("");
  $("chat").scrollIntoView(false);
  window.scrollTo(0, document.body.scrollHeight);
  document.querySelector("main > section:nth-child(2) div").scrollTop = 1e9;
}

function renderEvents(events) {
  if (!events.length) {
    $("events").innerHTML = `<div class="empty">暂无事件。</div>`;
    return;
  }
  $("events").innerHTML = events.map((e) => `
    <div class="ev ${e.type.startsWith("system") ? "sys" : ""}">
      <span class="seq mono">${e.seq}</span>
      <span class="ty mono">${e.type}</span>
    </div>`).join("");
  lastSeq = events.at(-1).seq;
}

function appendEvent(kind, payload) {
  const box = $("events");
  if (box.querySelector(".empty")) box.innerHTML = "";
  if (kind === "system/message") {
    box.insertAdjacentHTML("beforeend",
      `<div class="ev sys"><span class="seq mono">·</span>
       <span class="ty mono">system/message</span></div>`);
    return;
  }
  const line = toolLine(kind, payload);
  if (line) box.insertAdjacentHTML("beforeend", line);
  box.scrollTop = box.scrollHeight;
}

function toolLine(kind, payload) {
  if (kind === "tool_result") {
    const mark = payload.is_error ? "✗" : "✓";
    return `<div class="ev"><span class="seq mono">·</span>
      <span class="ty mono">tool ${escapeHtml(payload.name)} ${mark}</span></div>`;
  }
  if (kind === "step_response" && payload.tool_calls?.length) {
    const names = payload.tool_calls.map((c) => c.name).join(", ");
    return `<div class="ev"><span class="seq mono">·</span>
      <span class="ty mono">申请 ${escapeHtml(names)}</span></div>`;
  }
  return null;
}

let lastSeq = 0;
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// ---------- 发送 ----------
$("composer").onsubmit = async (event) => {
  event.preventDefault();
  const text = $("text").value.trim();
  if (!text || sending) return;
  if (!current) current = "default";
  sending = true;
  $("send").disabled = true;
  $("status").textContent = "运行中…（事件会实时出现在右栏）";

  // 本地先显示用户消息
  const box = $("chat");
  if (box.querySelector(".empty")) box.innerHTML = "";
  box.insertAdjacentHTML("beforeend",
    `<div class="msg user"><div class="who">user</div>${escapeHtml(text)}</div>`);
  $("text").value = "";

  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(current)}/send`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      let index;
      while ((index = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, index).trim();
        buffer = buffer.slice(index + 1);
        if (line) handleFrame(JSON.parse(line));
      }
    }
  } catch (err) {
    $("status").textContent = `出错：${err.message}`;
  } finally {
    sending = false;
    $("send").disabled = false;
    await openSession(current);
  }
};

function handleFrame(frame) {
  const {kind, payload} = frame;
  if (kind === "__done") {
    $("status").textContent =
      `turn ${payload.turn} · ${payload.status} · ${payload.steps} 步`;
    $("chat").insertAdjacentHTML("beforeend",
      `<div class="msg assistant"><div class="who">assistant</div>${escapeHtml(payload.final_text)}</div>`);
    $("chat").scrollTop = $("chat").scrollHeight;
    return;
  }
  if (kind === "__repair") {
    const banner = $("banner");
    banner.style.display = "block";
    banner.textContent = payload.message;
    return;
  }
  if (kind === "__error") {
    $("status").textContent = payload.message;
    return;
  }
  if (kind === "step_request") $("status").textContent = `第 ${payload.step} 步：请求模型…`;
  appendEvent(kind, payload);
}

// Enter 显式提交（不依赖各浏览器对隐式提交的差异）。
$("text").addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});

$("new-session").onclick = () => {
  // 不弹 prompt（对话框在自动化/键盘场景下最容易卡）：直接生成一个新会话 id。
  const id = "web-" + Date.now().toString(36);
  openSession(id);
};

// ---------- 启动 ----------
loadLedger();
loadSessions();
setInterval(loadSessions, 5000);   // 后台有别的写入时也能跟上
</script>
</body>
</html>
