<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini harness · P3</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>mini harness</div>
  <span class="chip">P3 · 完全插件化</span>
  <span class="chip" id="host-badge">…</span>
  <span class="chip" id="tools-badge" title="">工具 …</span>
  <div class="spacer"></div>
  <button class="tbtn on" id="toggle-left" title="折叠 / 展开左栏">会话</button>
  <button class="tbtn on" id="toggle-right" title="折叠 / 展开轨迹栏">轨迹</button>
  <!-- 面板按钮由脚本按「插件的自述」生成（app.js 读 /api/ledger 的 panels）：
       壳不认识任何插件，加一个面板插件不用改这里。 -->
  <span id="panel-btns"></span>
  <span class="dot-status" title="服务在线"></span>
</header>

<main>
  <section id="left">
    <div class="side-head"><h2>会话</h2>
      <button class="mini" id="new-session">＋ 新会话</button></div>
    <div id="sessions"></div>
    <div class="side-head" style="margin-top:20px">
      <h2>插件台账</h2><span class="count" id="plugin-count"></span></div>
    <div id="plugins"></div>
  </section>

  <section id="center">
    <div id="chat"><div class="wrap"></div></div>
    <div class="runline" id="runline"><span>就绪</span></div>
    <form id="composer" autocomplete="off">
      <div id="cmdmenu" hidden></div>
      <textarea id="text" rows="1"
        placeholder="输入消息…（Enter 发送 · Shift+Enter 换行 · 输入 / 看快捷命令）"></textarea>
      <button type="submit" id="send">发送</button>
    </form>
  </section>

  <section id="right">
    <div class="side-head"><h2>事件轨迹</h2>
      <span class="count mono" id="seq-tag"></span></div>
    <table id="events"><tbody></tbody></table>
  </section>
</main>

<!-- 通用面板容器（一次只显示一个；内容由脚本按插件自述填入） -->
<div id="plugin-panel" hidden>
  <div class="tbox">
    <div class="tbar">
      <h3 id="pp-title"></h3>
      <span class="turl" id="pp-url"></span>
      <div class="spacer"></div>
      <a class="tbtn" id="pp-open" target="_blank" rel="noopener">新标签打开</a>
      <button class="tbtn" id="pp-close">关闭</button>
    </div>
    <iframe id="pp-frame" title="插件页面"></iframe>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
