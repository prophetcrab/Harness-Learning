<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini harness · P3</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#11141a; --panel-2:#161a22; --panel-3:#1c212b;
    --line:#232936; --line-2:#2c3444;
    --fg:#e7eaf0; --muted:#8b93a5; --faint:#5c6478;
    --accent:#6ea8fe; --accent-soft:#1e2c44;
    --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --pend:#a78bfa;
    --mono:ui-monospace,Consolas,"Cascadia Mono","JetBrains Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}
  ::selection{background:#2b4a7a}
  *{scrollbar-width:thin;scrollbar-color:#2a3140 transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:#2a3140;border-radius:8px;
    border:2px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:#3a4358;background-clip:content-box}
  a{color:var(--accent)}

  /* ---------- header ---------- */
  header{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;
    border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px}
  .logo{width:10px;height:10px;border-radius:3px;background:var(--accent);
    box-shadow:0 0 12px #6ea8fe88}
  .chip{font-size:12px;color:var(--muted);border:1px solid var(--line);
    border-radius:99px;padding:2px 10px;white-space:nowrap;cursor:default}
  .chip b{color:var(--fg);font-weight:600}
  .spacer{flex:1}
  .tbtn{background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:8px;padding:4px 11px;font-size:12px;cursor:pointer;
    transition:all .15s}
  .tbtn:hover{color:var(--fg);border-color:var(--line-2);background:var(--panel-2)}
  .tbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .dot-status{width:8px;height:8px;border-radius:99px;background:var(--ok);
    box-shadow:0 0 8px #4ade8088;flex:none}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:266px minmax(0,1fr) 372px;
    grid-template-rows:minmax(0,1fr);
    height:calc(100vh - 52px);overflow:hidden}
  body.no-left main{grid-template-columns:minmax(0,1fr) 372px}
  body.no-right main{grid-template-columns:266px minmax(0,1fr)}
  body.no-left.no-right main{grid-template-columns:minmax(0,1fr)}
  body.no-left #left{display:none}
  body.no-right #right{display:none}
  #left{border-right:1px solid var(--line);background:var(--panel);
    overflow-y:auto;padding:14px 12px;min-height:0}
  #right{border-left:1px solid var(--line);background:#0e1116;
    overflow-y:auto;padding:12px;min-height:0}
  #center{display:flex;flex-direction:column;min-width:0;min-height:0;background:
    radial-gradient(1200px 400px at 50% -10%, #121722 0%, var(--bg) 60%)}

  .side-head{display:flex;align-items:center;justify-content:space-between;
    margin:0 2px 9px}
  .side-head h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--muted);margin:0;font-weight:600}
  .count{font-size:11px;color:var(--faint)}

  /* ---------- sessions ---------- */
  #sessions{display:flex;flex-direction:column;gap:3px}
  .item{padding:8px 10px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;transition:background .12s}
  .item:hover{background:var(--panel-2)}
  .item.active{background:var(--panel-2);border-color:#31405c;
    box-shadow:inset 2px 0 0 var(--accent)}
  .item-t{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .item-s{color:var(--faint);font-size:11.5px;margin-top:1px}
  .mini{background:var(--panel-2);border:1px solid var(--line-2);color:var(--fg);
    border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;transition:all .15s}
  .mini:hover{border-color:var(--accent);color:var(--accent)}
  .side-empty{color:var(--faint);font-size:12px;padding:6px 2px}

  /* ---------- plugins ---------- */
  #plugins{display:flex;flex-direction:column}
  .plug{display:flex;align-items:center;gap:8px;padding:5px 2px;
    border-bottom:1px dashed #1c212b;font-size:12.5px}
  .plug:last-child{border-bottom:none}
  .plug .dot{width:7px;height:7px;border-radius:99px;flex:none}
  .dot.active{background:var(--ok)} .dot.pending{background:var(--pend)}
  .dot.failed{background:var(--err)}
  .plug-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plug-i{color:var(--faint);font-size:11px}

  /* ---------- chat ---------- */
  #chat{flex:1;overflow-y:auto;padding:26px 22px 12px;scroll-behavior:smooth;
    min-height:0}
  .wrap{max-width:820px;margin:0 auto}
  .row{margin:0 0 14px;display:flex}
  .row.user{justify-content:flex-end}
  .row.assistant{justify-content:flex-start}
  .row.assistant + .row.assistant{margin-top:-4px}
  .msg.user{background:#1b2740;border:1px solid #2b3f63;border-radius:14px 14px 4px 14px;
    padding:9px 13px;max-width:76%;white-space:pre-wrap;word-break:break-word}
  .prose{max-width:100%;min-width:0;word-break:break-word}
  .prose p{margin:0 0 9px} .prose p:last-child{margin-bottom:0}
  .prose ul,.prose ol{margin:2px 0 9px;padding-left:22px}
  .prose code{background:#1a2029;border:1px solid #262e3b;border-radius:5px;
    padding:1px 5px;font-family:var(--mono);font-size:12.5px}
  .prose a{text-decoration:underline;text-underline-offset:2px}
  /* 标题 / 引用 / 分隔线 / 删除线 */
  .prose h1,.prose h2,.prose h3,.prose h4{margin:13px 0 7px;line-height:1.35;font-weight:650}
  .prose h1{font-size:17px} .prose h2{font-size:16px}
  .prose h3{font-size:14.5px} .prose h4{font-size:13.5px;color:var(--muted)}
  .prose > :first-child{margin-top:0}
  .prose blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--line-2);
    color:var(--muted)}
  .prose hr{border:none;border-top:1px solid var(--line);margin:13px 0}
  .prose del{color:var(--muted)}
  /* 表格 */
  .tablewrap{overflow-x:auto;margin:8px 0}
  .prose table{border-collapse:collapse;width:100%;font-size:13px}
  .prose th,.prose td{border:1px solid var(--line);padding:5px 10px;
    text-align:left;vertical-align:top}
  .prose th{background:#161a22;font-weight:600;white-space:nowrap}
  .prose tbody tr:nth-child(odd) td{background:#0f1218}
  /* 代码块：动作按钮 + 预览 */
  .code-actions{display:flex;gap:6px}
  .preview-btn{background:transparent;border:1px solid var(--line-2);color:var(--accent);
    border-radius:6px;font-size:11px;padding:1px 8px;cursor:pointer}
  .preview-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .previewbox{border-top:1px solid var(--line);background:#fff}
  .preview-frame{width:100%;height:360px;border:0;display:block;background:#fff}
  .codeblock{background:#0d1015;border:1px solid var(--line);border-radius:10px;
    margin:8px 0;overflow:hidden}
  .code-head{display:flex;justify-content:space-between;align-items:center;
    padding:5px 10px;background:#12161d;border-bottom:1px solid var(--line);
    font-size:11px;color:var(--muted)}
  .copy{background:transparent;border:1px solid var(--line-2);color:var(--muted);
    border-radius:6px;font-size:11px;padding:1px 8px;cursor:pointer}
  .copy:hover{color:var(--fg);border-color:var(--accent)}
  .codeblock pre{margin:0;padding:11px 13px;overflow-x:auto;font-family:var(--mono);
    font-size:12.5px;line-height:1.55}
  .row.status{justify-content:center;margin:2px 0 16px}
  .row.status span{font-size:11px;color:var(--faint);border:1px solid #1c212b;
    border-radius:99px;padding:1px 11px}
  .row.sys{justify-content:flex-start}
  .syschip{font-size:12px;color:var(--muted)}
  .syschip summary{cursor:pointer;list-style:none;display:inline-block;
    border:1px dashed var(--line-2);border-radius:8px;padding:2px 10px}
  .syschip summary::-webkit-details-marker{display:none}
  .syschip summary:hover{color:var(--fg)}
  .syschip pre{max-width:760px;max-height:300px;overflow:auto;background:#0d1015;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:var(--mono);font-size:12px;white-space:pre-wrap;margin:8px 0 0}
  .sysnote{font-size:11.5px;color:var(--faint);border-left:2px solid var(--line-2);
    padding:1px 10px}
  /* 压缩标记（`_05`）：一个可展开的折叠徽标，摘要全文在 <pre> 里 */
  .row.compact{justify-content:flex-start}
  .cmpchip{font-size:11.5px;color:var(--muted)}
  .cmpchip summary{cursor:pointer;list-style:none;display:inline-block;
    background:#141b26;border:1px solid #24303f;border-radius:8px;padding:3px 10px}
  .cmpchip summary::-webkit-details-marker{display:none}
  .cmpchip summary:hover{color:var(--fg)}
  .cmpchip pre{max-width:760px;max-height:280px;overflow:auto;background:#0d1015;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:var(--mono);font-size:12px;white-space:pre-wrap;margin:8px 0 0}

  /* tool cards */
  .toolcard{border:1px solid var(--line);border-radius:10px;background:#10141b;
    margin:6px 0 10px;max-width:760px;overflow:hidden;
    border-left:3px solid var(--warn)}
  .toolcard.ok{border-left-color:var(--ok)}
  .toolcard.error{border-left-color:var(--err)}
  .tool-head{display:flex;align-items:center;gap:9px;padding:7px 11px;
    font-size:12.5px}
  .tool-name{font-weight:600;font-family:var(--mono)}
  .tool-args{color:var(--muted);font-size:11.5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .tool-state{font-size:11.5px;color:var(--warn);flex:none}
  .toolcard.ok .tool-state{color:var(--ok)}
  .toolcard.error .tool-state{color:var(--err)}
  .tool-body pre{margin:0;padding:8px 12px 10px;border-top:1px dashed #1c212b;
    font-family:var(--mono);font-size:12px;white-space:pre-wrap;
    max-height:260px;overflow:auto;color:#c3cad8}
  .tool-body pre.one{white-space:pre-wrap}
  .tool-body details summary{cursor:pointer;color:var(--muted);font-size:11.5px;
    padding:6px 12px;border-top:1px dashed #1c212b}

  /* working indicator */
  .row.working span.dots{display:inline-flex;align-items:center;gap:4px}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);
    animation:bounce 1.15s infinite}
  .dots i:nth-child(2){animation-delay:.15s}
  .dots i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}
    30%{transform:translateY(-4px);opacity:1}}
  .working{display:flex;align-items:center;gap:9px;color:var(--muted);
    font-size:12.5px;margin:0 0 14px}

  /* empty state */
  .empty{max-width:560px;margin:9vh auto 0;text-align:center;color:var(--muted)}
  .empty-ic{font-size:30px;color:var(--accent);opacity:.85}
  .empty-t{font-size:17px;color:var(--fg);margin:8px 0 4px;font-weight:600}
  .empty-s{font-size:12.5px;margin-bottom:18px}
  .hints{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .hint{background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted);
    border-radius:99px;padding:6px 14px;font-size:12.5px;cursor:pointer;
    transition:all .15s}
  .hint:hover{border-color:var(--accent);color:var(--fg)}

  /* 流式光标 */
  .cursor{display:inline-block;width:7px;height:14px;margin-left:2px;
    vertical-align:-2px;background:var(--accent);animation:blink .9s step-end infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .streaming-live{min-height:22px}

  /* 审批卡片 */
  .approval{border:1px solid #4a3a20;border-left:3px solid var(--warn);
    border-radius:10px;background:#181a14;margin:9px 0 12px;max-width:760px;
    overflow:hidden;animation:apvin .2s ease-out}
  @keyframes apvin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .apv-head{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:13px}
  .apv-ic{color:var(--warn);font-size:15px}
  .apv-title{font-weight:600}
  .apv-tool{font-family:var(--mono);color:var(--warn);font-size:12px}
  .apv-reason{color:var(--muted);font-size:12px;padding:0 12px 6px}
  .apv-code{margin:0 12px;border:1px solid var(--line);border-radius:8px;
    background:#0d1015;max-height:320px;overflow:auto}
  .apv-code pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:12px;
    white-space:pre;line-height:1.5}
  .apv-actions{display:flex;gap:9px;padding:10px 12px;align-items:center}
  .apv-approve{background:var(--ok);color:#06210f;border:none;border-radius:8px;
    padding:7px 16px;font-weight:600;font-size:13px;cursor:pointer}
  .apv-approve:hover{filter:brightness(1.08)}
  .apv-deny{background:transparent;color:var(--err);border:1px solid #5a2a2a;
    border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer}
  .apv-deny:hover{background:#241717}
  .apv-done{font-size:12px;padding:9px 12px}
  .apv-done.ok{color:var(--ok)} .apv-done.no{color:var(--err)}
  .apv-wait{color:var(--muted);font-size:12px}
  .plug-new{animation:flash 1.4s ease-out}
  @keyframes flash{0%{background:#1e2c44}100%{background:transparent}}
  .dot.new{background:var(--ok);box-shadow:0 0 9px var(--ok)}

  /* ---------- runline + composer ---------- */
  .runline{display:flex;align-items:center;gap:8px;padding:7px 22px;
    font-size:12px;color:var(--muted);border-top:1px solid #161a22;min-height:31px}
  .runline.err{color:var(--err)}
  .spinner{width:10px;height:10px;border:2px solid var(--warn);
    border-top-color:transparent;border-radius:50%;flex:none;
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #composer{display:flex;gap:9px;align-items:flex-end;padding:10px 22px 14px;
    border-top:1px solid var(--line);background:var(--panel)}
  #text{flex:1;resize:none;background:var(--panel-2);border:1px solid var(--line-2);
    border-radius:12px;color:var(--fg);padding:11px 14px;
    font:inherit;line-height:1.55;max-height:180px;outline:none;
    transition:border-color .15s, box-shadow .15s}
  #text:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6ea8fe22}
  #text::placeholder{color:var(--faint)}
  #send{background:var(--accent);color:#08111f;border:none;border-radius:11px;
    padding:11px 18px;font-weight:600;font-size:13.5px;cursor:pointer;
    transition:opacity .15s, transform .05s;flex:none}
  #send:hover:not(:disabled){filter:brightness(1.08)}
  #send:active:not(:disabled){transform:scale(.97)}
  #send:disabled{opacity:.45;cursor:default}
  /* 手动压缩按钮（/compact）：次级样式，常驻在输入框左侧 */
  #compact-btn{background:#141b26;color:var(--muted);border:1px solid #24303f;
    border-radius:11px;padding:11px 13px;font-size:12.5px;cursor:pointer;flex:none;
    transition:color .15s, border-color .15s, opacity .15s;white-space:nowrap}
  #compact-btn:hover:not(:disabled){color:var(--fg);border-color:#33445a}
  #compact-btn:disabled{opacity:.4;cursor:default}

  /* ---------- trace panel ---------- */
  .evse{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--faint);
    margin:9px 0 3px;text-transform:none}
  .evse::before,.evse::after{content:"";height:1px;background:#1b2029;flex:1}
  table#events{width:100%;border-collapse:collapse;font-size:11.5px}
  .ev td{padding:3px 4px;border-bottom:1px solid #14181f;
    vertical-align:top;cursor:pointer}
  .ev:hover td{background:#12161d}
  .ev-seq{color:var(--faint);text-align:right;width:30px;font-family:var(--mono)}
  .ev-type{font-family:var(--mono);white-space:nowrap;color:var(--muted);
    max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .ev-sum{color:#9aa3b2;word-break:break-word}
  .ev-time{color:#3d4658;white-space:nowrap;font-family:var(--mono);text-align:right}
  .ev.session .ev-type{color:var(--pend)}
  .ev.turn .ev-type{color:var(--accent)}
  .ev.step .ev-type{color:#5aa0e0}
  .ev.user .ev-type{color:#7dd3fc}
  .ev.assistant .ev-type{color:var(--ok)}
  .ev.tool .ev-type{color:var(--warn)}
  .ev.system .ev-type{color:var(--pend)}
  .ev-raw td{background:#0c0f14}
  .ev-raw pre{margin:0;padding:8px 10px;font-family:var(--mono);font-size:11px;
    white-space:pre-wrap;color:#9fb0c8;max-height:300px;overflow:auto}
  .banner{margin:0 0 14px;padding:8px 12px;border-radius:9px;font-size:12px;
    background:#1c1f17;border:1px solid #3a4227;color:var(--warn)}
  /* ---------- token 用量面板（token-usage 插件的挂载点） ---------- */
  #token-panel,#ctx-panel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;
    justify-content:center;padding:26px;background:#05070ad9;backdrop-filter:blur(3px)}
  #token-panel .tbox,#ctx-panel .tbox{width:min(1080px,100%);height:100%;display:flex;
    flex-direction:column;background:var(--bg);border:1px solid var(--line-2);
    border-radius:14px;overflow:hidden;box-shadow:0 24px 70px #0009}
  #token-panel .tbar,#ctx-panel .tbar{display:flex;align-items:center;gap:10px;padding:8px 12px;
    border-bottom:1px solid var(--line);background:var(--panel-2)}
  #token-panel .tbar h3,#ctx-panel .tbar h3{margin:0;font-size:13px;font-weight:600}
  #token-panel .turl,#ctx-panel .turl{font-family:var(--mono);font-size:11px;color:var(--faint);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #token-panel .tbar a,#ctx-panel .tbar a{text-decoration:none;display:inline-block}
  #token-frame,#ctx-frame{flex:1;width:100%;border:0;background:#12141a}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>mini harness</div>
  <span class="chip">P3 · 完全插件化</span>
  <span class="chip" id="host-badge">…</span>
  <span class="chip" id="tools-badge" title="">工具 …</span>
  <div class="spacer"></div>
  <button class="tbtn on" id="toggle-left" title="折叠 / 展开左栏">会话</button>
  <button class="tbtn on" id="toggle-right" title="折叠 / 展开轨迹栏">轨迹</button>
  <button class="tbtn" id="ctx-btn" title="上下文容量仪表（context-meter 插件）">📐 上下文</button>
  <button class="tbtn" id="token-btn" title="Token 用量统计（token-usage 插件）">📊 Token 用量</button>
  <span class="dot-status" title="服务在线"></span>
</header>

<main>
  <section id="left">
    <div class="side-head"><h2>会话</h2>
      <button class="mini" id="new-session">＋ 新会话</button></div>
    <div id="sessions"></div>
    <div class="side-head" style="margin-top:20px">
      <h2>插件台账</h2><span class="count" id="plugin-count"></span></div>
    <div id="plugins"></div>
  </section>

  <section id="center">
    <div id="chat"><div class="wrap"></div></div>
    <div class="runline" id="runline"><span>就绪</span></div>
    <form id="composer" autocomplete="off">
      <button type="button" id="compact-btn" title="手动压缩上下文（等同输入 /compact）：把最后一轮之前的历史折叠成一条摘要">⟳ 压缩</button>
      <textarea id="text" rows="1"
        placeholder="输入消息…（Enter 发送 · Shift+Enter 换行 · /compact 手动压缩）"></textarea>
      <button type="submit" id="send">发送</button>
    </form>
  </section>

  <section id="right">
    <div class="side-head"><h2>事件轨迹</h2>
      <span class="count mono" id="seq-tag"></span></div>
    <table id="events"><tbody></tbody></table>
  </section>
</main>

<div id="ctx-panel" hidden>
  <div class="tbox">
    <div class="tbar">
      <h3>📐 上下文容量</h3>
      <span class="turl" id="ctx-url"></span>
      <a class="tbtn" id="ctx-open" target="_blank" rel="noopener">新标签打开</a>
      <button class="tbtn" id="ctx-close">关闭</button>
    </div>
    <iframe id="ctx-frame" title="上下文容量仪表"></iframe>
  </div>
</div>

<div id="token-panel" hidden>
  <div class="tbox">
    <div class="tbar">
      <h3>📊 Token 用量</h3>
      <span class="turl" id="token-url"></span>
      <div class="spacer"></div>
      <a class="tbtn" id="token-open" target="_blank" rel="noopener">新标签打开</a>
      <button class="tbtn" id="token-close">关闭</button>
    </div>
    <iframe id="token-frame" title="Token 用量统计"></iframe>
  </div>
</div>

<script>
"use strict";
/* ---------------- utils ---------------- */
const $ = (id) => document.getElementById(id);
const chatEl = $("chat"), wrapEl = chatEl.querySelector(".wrap");
const sessionsEl = $("sessions"), pluginsEl = $("plugins"), eventsEl = $("events");
const state = { current: null, sending: false, follow: true };
window.addEventListener("error", (e) => { window.__lastError = String(e.message || e); });

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clip = (s, n = 120) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n) + "…" : s; };
const cssEsc = (s) => (window.CSS && CSS.escape) ? CSS.escape(String(s))
  : String(s).replace(/["\\]/g, "\\$&");
const fmtTime = (iso) => { try { return new Date(iso).toLocaleTimeString("zh-CN", { hour12: false }); }
  catch { return ""; } };
const el = (html) => { const t = document.createElement("template");
  t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* ---------------- mini markdown ---------------- */
let codeSeq = 0;
const previewCode = {};   // code id → {lang, code}：预览内容按需在切换时注入
function codeBlockHtml(lang, code) {
  const id = `code-${++codeSeq}`;
  const l = String(lang || "").toLowerCase();
  const previewable = ["html", "htm", "svg", "css"].includes(l);
  previewCode[id] = { lang: l, code };
  return `<div class="codeblock"><div class="code-head"><span>${esc(lang || "text")}</span>`
    + `<span class="code-actions">`
    + (previewable ? `<button type="button" class="preview-btn" data-pre="${id}">预览</button>` : "")
    + `<button type="button" class="copy" data-pre="${id}">复制</button></span></div>`
    + `<pre id="${id}">${esc(code.replace(/\n$/, ""))}</pre>`
    + (previewable ? `<div class="previewbox" id="pv-${id}" hidden></div>` : "")
    + `</div>`;
}
function previewSrc(id) {
  const { lang, code } = previewCode[id] || {};
  if (lang === "css") {
    // CSS 片段单独预览没有意义：给一个最小示例骨架，让样式有东西可作用
    return `<!doctype html><html><head><meta charset="utf-8"><style>${code}</style></head>`
      + `<body style="font:14px/1.6 system-ui,'Microsoft YaHei',sans-serif;padding:16px">`
      + `<h3 style="margin:0 0 6px">CSS 预览（示例骨架）</h3>`
      + `<p>这段样式已应用到下面的元素。</p>`
      + `<button>按钮</button> <a href="#">链接</a>`
      + `<div class="card" style="margin-top:10px;padding:8px;border:1px solid #ddd">卡片内容</div>`
      + `</body></html>`;
  }
  // html / svg：已经是完整文档就直接用，否则包一层
  return /<html|<!doctype/i.test(code)
    ? code
    : `<!doctype html><html><head><meta charset="utf-8"></head><body>${code}</body></html>`;
}
function md(src) {
  const fences = [], inlines = [];
  let t = String(src ?? "");
  t = t.replace(/```([\w+#.-]*)[ \t]*\r?\n?([\s\S]*?)```/g, (m, lang, code) => {
    fences.push([lang, code]); return `\uE000F${fences.length - 1}\uE000`;
  });
  t = t.replace(/`([^`\n]+)`/g, (m, c) => { inlines.push(c); return `\uE000I${inlines.length - 1}\uE000`; });
  t = esc(t);
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,，。！？!?；;])/g, "$1<em>$2</em>");
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  const lines = t.split("\n");
  const out = [];
  let list = null, quote = null, para = null;
  const flushList = () => { if (list) {
    out.push(`<${list.tag}>${list.items.map((i) => `<li>${i}</li>`).join("")}</${list.tag}>`);
    list = null; } };
  const flushQuote = () => { if (quote) {
    out.push(`<blockquote>${quote.join("<br>")}</blockquote>`); quote = null; } };
  const flushPara = () => { if (para) {
    out.push(`<p>${para.join("<br>")}</p>`); para = null; } };
  const flushAll = () => { flushList(); flushQuote(); flushPara(); };

  // 表格：表头行 + 分隔行（| --- | --- |），随后是数据行
  const isSeparator = (s) => s.includes("|") && s.includes("-")
    && /^\|?[\s:|-]+\|?$/.test(s);
  const splitCells = (s) => s.replace(/^\s*\|/, "").replace(/\|\s*$/, "")
    .split("|").map((c) => c.trim());
  const alignOf = (c) => (/^:-+:$/.test(c) ? "center"
    : /^:-+/.test(c) ? "left" : /-+:$/.test(c) ? "right" : "");

  for (let i = 0; i < lines.length; i++) {
    const s = lines[i].trim();
    if (/^\uE000F\d+\uE000$/.test(s)) { flushAll(); out.push(s); continue; }
    if (!s) { flushAll(); continue; }

    // 表格
    if (/^\|.*\|$/.test(s) && i + 1 < lines.length
        && isSeparator(lines[i + 1].trim())) {
      flushAll();
      const head = splitCells(s);
      const align = splitCells(lines[i + 1].trim()).map(alignOf);
      const rows = [];
      i += 2;
      while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
        rows.push(splitCells(lines[i].trim())); i++;
      }
      i--;
      const style = (k) => (align[k] ? ` style="text-align:${align[k]}"` : "");
      const th = head.map((c, k) => `<th${style(k)}>${c}</th>`).join("");
      const tb = rows.map((r) =>
        `<tr>${r.map((c, k) => `<td${style(k)}>${c}</td>`).join("")}</tr>`).join("");
      out.push(`<div class="tablewrap"><table><thead><tr>${th}</tr></thead>`
        + `<tbody>${tb}</tbody></table></div>`);
      continue;
    }
    // 标题
    let m = s.match(/^(#{1,6})\s+(.*)$/);
    if (m) { flushAll(); const lv = Math.min(m[1].length, 4);
      out.push(`<h${lv}>${m[2]}</h${lv}>`); continue; }
    // 分隔线
    if (/^([-*_])\1{2,}$/.test(s.replace(/\s/g, ""))) { flushAll(); out.push("<hr>"); continue; }
    // 引用（> 已被转义成 &gt;）
    m = s.match(/^&gt;\s?(.*)$/);
    if (m) { flushList(); flushPara(); (quote || (quote = [])).push(m[1]); continue; }
    // 无序列表
    m = s.match(/^[-*•]\s+(.*)$/);
    if (m) { flushQuote(); flushPara();
      if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; }
      list.items.push(m[1]); continue; }
    // 有序列表
    m = s.match(/^\d+[.)]\s+(.*)$/);
    if (m) { flushQuote(); flushPara();
      if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; }
      list.items.push(m[1]); continue; }
    // 普通段落（连续行合并，软换行保留为 <br>）
    flushList(); flushQuote();
    (para || (para = [])).push(s);
  }
  flushAll();
  let html = out.join("");
  html = html.replace(/\uE000I(\d+)\uE000/g, (m, i) => `<code>${esc(inlines[+i])}</code>`);
  html = html.replace(/\uE000F(\d+)\uE000/g, (m, i) => codeBlockHtml(fences[+i][0], fences[+i][1]));
  return html;
}

/* ---------------- chat nodes ---------------- */
function userNode(text) {
  return el(`<div class="row user"><div class="msg user">${esc(text).replace(/\n/g, "<br>")}</div></div>`);
}
function assistantNode(content) {
  return el(`<div class="row assistant"><div class="prose">${md(content)}</div></div>`);
}
function turnStatusNode(turn, status, steps) {
  const label = { done: "完成", max_steps: "步数用尽", cancelled: "已取消" }[status] || status;
  return el(`<div class="row status"><span>turn ${esc(turn)} · ${esc(label)} · ${esc(steps)} 步</span></div>`);
}
function systemChip(prompt) {
  return el(`<div class="row sys"><details class="syschip">`
    + `<summary>系统提示词（点开查看）</summary><pre>${esc(prompt)}</pre></details></div>`);
}
function sysNoteNode() { return el(`<div class="row sys"><div class="sysnote">系统提示词已更新</div></div>`); }
/* 压缩标记（`_05`）：日志里一条 compact/checkpoint，界面上一个折叠徽标。
   点开能看到摘要全文——"模型眼前的历史被折成了什么"是可见的。 */
function compactNode(d) {
  const before = fmtTokens(d.before_tokens), after = fmtTokens(d.after_tokens);
  const node = el(`<div class="row compact"><details class="cmpchip">`
    + `<summary>⟳ 上下文已压缩：折叠 ${esc(d.folded ?? "?")} 条消息`
    + (before && after ? `（约 ${before} → ${after} tokens）` : "")
    + `</summary><pre>${esc(d.summary || "")}</pre></details></div>`);
  return node;
}
function fmtTokens(n) {
  return typeof n === "number" && n > 0 ? n.toLocaleString("en-US") : "";
}

function toolCard({ callId, name, args, result, isError }) {
  const argsText = args == null ? "" : (typeof args === "string" ? args : JSON.stringify(args));
  const node = el(`<div class="toolcard" data-call="${esc(callId)}">`
    + `<div class="tool-head"><span class="tool-name">${esc(name)}</span>`
    + `<span class="tool-args">${esc(clip(argsText, 110))}</span>`
    + `<span class="tool-state">运行中…</span></div>`
    + `<div class="tool-body"></div></div>`);
  if (result !== undefined) fillToolCard(node, result, isError);
  return node;
}
function fillToolCard(node, result, isError) {
  node.classList.add(isError ? "error" : "ok");
  node.querySelector(".tool-state").textContent = isError ? "✗ 失败" : "✓ 完成";
  const body = node.querySelector(".tool-body");
  const text = typeof result === "string" ? result : JSON.stringify(result, null, 2);
  if (text == null || text === "{}" || text === "") { body.remove(); return; }
  body.innerHTML = (text.includes("\n") || text.length > 200)
    ? `<details><summary>结果（${text.length} 字符）</summary><pre>${esc(clip(text, 4000))}</pre></details>`
    : `<pre class="one">${esc(text)}</pre>`;
}

/* ---------------- chat rendering ---------------- */
function renderChatFromEvents(events) {
  wrapEl.innerHTML = "";
  if (!events.length) { wrapEl.innerHTML = emptyStateHtml(); return; }
  for (const ev of events) {
    const d = ev.data || {};
    switch (ev.type) {
      case "session/start": if (d.system_prompt) wrapEl.appendChild(systemChip(d.system_prompt)); break;
      case "system/message": wrapEl.appendChild(sysNoteNode()); break;
      case "user/message": wrapEl.appendChild(userNode(d.content)); break;
      case "assistant/message":
        if (d.content) wrapEl.appendChild(assistantNode(d.content));
        for (const call of (d.tool_calls || []))
          wrapEl.appendChild(toolCard({ callId: call.id, name: call.name, args: call.arguments }));
        break;
      case "tool/result": {
        const node = wrapEl.querySelector(`[data-call="${cssEsc(d.call_id)}"]`);
        if (node) fillToolCard(node, d.result, d.is_error);
        break;
      }
      case "turn/end": wrapEl.appendChild(turnStatusNode(d.turn, d.status, d.steps ?? 0)); break;
      case "compact/checkpoint": wrapEl.appendChild(compactNode(d)); break;
    }
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}
function emptyStateHtml() {
  return `<div class="empty"><div class="empty-ic">◍</div>
    <div class="empty-t">开始一段对话</div>
    <div class="empty-s">这个会话还没有消息。试试：</div>
    <div class="hints">
      <button type="button" class="hint" data-q="工作区里有哪些文件？">工作区里有哪些文件？</button>
      <button type="button" class="hint" data-q="帮我算 1234*56.78">帮我算 1234*56.78</button>
      <button type="button" class="hint" data-q="用 shell 看看当前目录">用 shell 看看当前目录</button>
    </div></div>`;
}

/* ---------------- approvals ---------------- */
function approvalNode(req) {
  const node = el(`<div class="approval" data-apv="${esc(req.id)}">
    <div class="apv-head"><span class="apv-ic">⚠</span>
      <span class="apv-title">需要你的批准</span>
      <span class="apv-tool">${esc(req.tool)}</span></div>
    <div class="apv-reason">${esc(req.reason || "该操作被标记为需要审批")}</div>
    ${req.preview ? `<div class="apv-code"><pre>${esc(req.preview)}</pre></div>` : ""}
    <div class="apv-actions">
      <button type="button" class="apv-approve">批准并执行</button>
      <button type="button" class="apv-deny">拒绝</button>
      <span class="apv-wait">等待你的决定…</span></div></div>`);
  return node;
}
async function answerApproval(node, approved) {
  const id = node.dataset.apv;
  node.querySelector(".apv-actions").remove();
  try {
    await fetch("/api/approvals/" + encodeURIComponent(id), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ approved }),
    });
    const done = el(`<div class="apv-done ${approved ? "ok" : "no"}">`
      + (approved ? "✓ 已批准，正在执行…" : "✗ 已拒绝（模型会收到拒绝原因）") + "</div>");
    node.appendChild(done);
  } catch (err) {
    node.appendChild(el(`<div class="apv-done no">提交失败：${esc(err.message)}</div>`));
  }
}

/* ---------------- live frames ---------------- */
function setRunline(html, cls) {
  const line = $("runline");
  line.className = "runline" + (cls ? " " + cls : "");
  line.innerHTML = html;
}
function setIdle(text) { setRunline(`<span>${esc(text)}</span>`); }
function setRunning(text) {
  setRunline(`<span class="spinner"></span><span>${esc(text)}</span>`);
}
function ensureWorking(text) {
  let node = wrapEl.querySelector(".working");
  if (!node) { node = el(`<div class="row working"><span class="dots"><i></i><i></i><i></i></span><span class="wt"></span></div>`);
    wrapEl.appendChild(node); }
  node.querySelector(".wt").textContent = text;
  scrollBottom();
}
function removeWorking() { const n = wrapEl.querySelector(".working"); if (n) n.remove(); }
function scrollBottom() { if (state.follow) chatEl.scrollTop = chatEl.scrollHeight; }

function handleFrame(kind, payload) {
  switch (kind) {
    case "step_request": setRunning(`第 ${payload.step} 步 · 请求模型…`);
      ensureWorking(`第 ${payload.step} 步 · 请求模型（${payload.message_count} 条消息）`); break;
    case "step_response": {
      // 流式模式下：把刚收满的气泡"定稿"（换成正式 Markdown 渲染）；否则新建。
      const live = wrapEl.querySelector(".streaming-live");
      if (live) {
        const cursor = live.parentElement.querySelector(".cursor");
        if (cursor) cursor.remove();
        live.classList.remove("streaming-live");
        live.dataset.raw = "";
        live.innerHTML = payload.content ? md(payload.content) : "";
      } else if (payload.content) {
        wrapEl.appendChild(assistantNode(payload.content));
      }
      for (const c of (payload.tool_calls || []))
        wrapEl.appendChild(toolCard({ callId: c.id, name: c.name, args: c.arguments }));
      if (payload.tool_calls?.length) {
        setRunning(`第 ${payload.step} 步 · 执行工具…`);
        ensureWorking(`执行 ${payload.tool_calls.map((c) => c.name).join("、")}…`);
      }
      scrollBottom(); break;
    }
    case "tool_result": {
      const node = wrapEl.querySelector(`[data-call="${cssEsc(payload.call_id)}"]`);
      if (node) fillToolCard(node, payload.result, payload.is_error);
      scrollBottom(); break;
    }
    case "turn_end":
      removeWorking();
      wrapEl.querySelectorAll(".cursor").forEach((c) => c.remove());
      wrapEl.querySelectorAll(".streaming-live").forEach((n) => n.classList.remove("streaming-live"));
      wrapEl.appendChild(turnStatusNode(payload.turn, payload.status, payload.steps));
      scrollBottom(); break;
    case "step_delta": {
      // 逐段到达：同一 step 内往同一个气泡追加（首个文本增量创建它）
      if (!payload.text) break;
      let live = wrapEl.querySelector(".streaming-live");
      if (!live) {
        removeWorking();
        const node = el(`<div class="row assistant"><div class="prose streaming-live"></div></div>`);
        wrapEl.appendChild(node);
        live = node.querySelector(".streaming-live");
      }
      const cursor = live.parentElement.querySelector(".cursor");
      live.dataset.raw = (live.dataset.raw || "") + payload.text;
      live.textContent = live.dataset.raw;
      if (!cursor) live.after(el(`<span class="cursor"></span>`));
      setRunning(`第 ${payload.step} 步 · 流式接收中…`);
      scrollBottom();
      break;
    }
    case "stream_cancelled": {
      removeWorking();
      const live = wrapEl.querySelector(".streaming-live");
      if (live) {
        const cur = live.parentElement.querySelector(".cursor");
        if (cur) cur.remove();
        live.classList.remove("streaming-live");
      }
      setRunline("已取消（保留已收到的部分）", "err");
      break;
    }
    case "compact_applied": {
      // 压缩发生（`_05`）：聊天流里插一个折叠徽标，runline 说明一句。
      wrapEl.appendChild(compactNode(payload));
      const how = payload.trigger === "manual" ? "手动压缩" : "上下文已压缩";
      setRunline(`${how}：折叠 ${payload.folded} 条 → 约 ${fmtTokens(payload.after_tokens) || "?"} tokens`);
      scrollBottom();
      break;
    }
    case "__compact_noop": {
      // 收尾帧由 runCompact 统一处理（这里兜底：事件流里也留个痕）
      showBanner(payload.message || "没有可压缩的历史");
      break;
    }
    case "compact_failed": {
      // 失败是瞬态的：只提示一句，对话照常继续（fail-soft）
      showBanner("上下文压缩未成功（已跳过本次）：" + (payload.error || "未知原因"));
      break;
    }
    case "__approval": {
      removeWorking();
      const node = approvalNode(payload);
      wrapEl.appendChild(node); scrollBottom();
      setRunline("等待你的审批…"); break;
    }
    case "__repair": showBanner(payload.message || "上次会话被强杀，日志尾部已自动修复"); break;
    case "__error": removeWorking(); setRunline(`出错：${esc(payload.message)}`, "err"); break;
    default: break;
  }
}
function showBanner(text) { const b = $("banner"); b.textContent = text; b.hidden = false; }

/* ---------------- trace panel ---------------- */
let evRows = [];
function evCat(type) { return ({ session: 1, turn: 1, step: 1, user: 1, assistant: 1, tool: 1, system: 1 })[String(type).split("/")[0]] ? String(type).split("/")[0] : "other"; }
function evSummary(type, d) {
  d = d || {};
  switch (type) {
    case "session/start": return "会话建立（system_prompt + 装配单）";
    case "system/message": return clip(String(d.content || "").replace(/\s+/g, " "), 70);
    case "turn/start": return `turn ${d.turn}`;
    case "user/message": return clip(String(d.content || "").replace(/\s+/g, " "), 70);
    case "step/start": return `turn ${d.turn} · step ${d.step} · ${d.message_count} 条消息 / ${d.tool_count} 工具`;
    case "step/end": return `step ${d.step} 结束`;
    case "assistant/message": return d.tool_calls?.length
      ? `申请调用 ${d.tool_calls.map((c) => c.name).join("、")}`
      : clip(String(d.content || "").replace(/\s+/g, " "), 70);
    case "tool/result": return `${d.name} ${d.is_error ? "✗" : "✓"} ${clip(JSON.stringify(d.result), 46)}`;
    case "turn/end": return `${d.status} · ${d.steps} 步`;
    case "compact/checkpoint": return `折叠 ${d.folded ?? "?"} 条 → 摘要 ${clip(String(d.summary || "").replace(/\s+/g, " "), 46)}`;
    default: return clip(JSON.stringify(d), 70);
  }
}
function evRowHtml(i, seq, type, summary, ts) {
  return `<tr class="ev ${evCat(type)}" data-i="${i}" title="${esc(summary)}">`
    + `<td class="ev-seq">${seq ?? "·"}</td>`
    + `<td class="ev-type">${esc(type)}</td>`
    + `<td class="ev-sum">${esc(summary)}</td>`
    + `<td class="ev-time">${ts ? esc(fmtTime(ts)) : ""}</td></tr>`;
}
function renderEventsFromHistory(events) {
  evRows = events.map((e) => ({ seq: e.seq, type: e.type, data: e.data, ts: e.ts }));
  const body = eventsEl.querySelector("tbody");
  body.innerHTML = "";
  let lastTurn = null;
  for (let i = 0; i < evRows.length; i++) {
    const ev = evRows[i];
    if (ev.type === "turn/start" && ev.data?.turn !== lastTurn) {
      lastTurn = ev.data.turn;
      body.insertAdjacentHTML("beforeend", `<tr class="evse"><td colspan="4"><span>turn ${esc(lastTurn)}</span></td></tr>`);
    }
    body.insertAdjacentHTML("beforeend", evRowHtml(i, ev.seq, ev.type, evSummary(ev.type, ev.data), ev.ts));
  }
  $("seq-tag").textContent = evRows.length ? `≤ ${evRows.at(-1).seq}` : "";
  eventsEl.scrollTop = eventsEl.scrollHeight;
}
function appendLiveEvent(kind, payload) {
  const map = { turn_start: "turn/start", step_request: "step/start", step_response: "assistant/message", tool_result: "tool/result", step_end: "step/end", turn_end: "turn/end" };
  const type = map[kind] || kind;
  evRows.push({ seq: null, type, data: payload, ts: null });
  eventsEl.querySelector("tbody").insertAdjacentHTML("beforeend",
    evRowHtml(evRows.length - 1, null, type, evSummary(type, payload), null));
  eventsEl.scrollTop = eventsEl.scrollHeight;
}
eventsEl.addEventListener("click", (e) => {
  const row = e.target.closest("tr.ev"); if (!row) return;
  const next = row.nextElementSibling;
  if (next && next.classList.contains("ev-raw")) { next.remove(); return; }
  const item = evRows[+row.dataset.i]; if (!item) return;
  const data = { ...(item.data || {}) };
  if (data.prompt_trace) data.prompt_trace = "(装配单略)";
  const tr = document.createElement("tr"); tr.className = "ev-raw";
  tr.innerHTML = `<td colspan="4"><pre>${esc(JSON.stringify(data, null, 2))}</pre></td>`;
  row.after(tr);
});

/* ---------------- ledger / sessions ---------------- */
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}
let knownPlugins = null;
async function loadLedger() {
  const data = await api("/api/ledger");
  const tools = data.tools || [], plugins = data.plugins || [];
  // 插件集合变化 → 高亮新增的那一行（"装完立刻出现在左栏"的视觉反馈）
  const names = plugins.map((p) => p.name);
  const added = knownPlugins ? names.filter((n) => !knownPlugins.includes(n)) : [];
  const removed = knownPlugins ? knownPlugins.filter((n) => !names.includes(n)) : [];
  knownPlugins = names;
  $("tools-badge").innerHTML = `工具 <b>${tools.length}</b>`;
  $("tools-badge").title = tools.join(" · ");
  pluginsEl.innerHTML = plugins.map((p) => `
    <div class="plug ${added.includes(p.name) ? "plug-new" : ""}"
         title="依赖：${p.inject.length ? esc(p.inject.join(", ")) : "无"}">
      <span class="dot ${esc(p.status)}${added.includes(p.name) ? " new" : ""}"></span>
      <span class="plug-n">${esc(p.name)}</span>
      ${p.inject.length ? `<span class="plug-i mono">← ${esc(p.inject.join(","))}</span>` : ""}
    </div>`).join("") || `<div class="side-empty">（无）</div>`;
  if (added.length) setIdle(`插件台账更新：新增 ${added.join("、")}`
    + (removed.length ? `；移除 ${removed.join("、")}` : ""));
  $("plugin-count").textContent =
    `${plugins.filter((p) => p.status === "active").length}/${plugins.length} 活跃`;

async function loadSessions() {
  const data = await api("/api/sessions");
  const items = data.sessions || [];
  sessionsEl.innerHTML = items.length ? items.map((s) => `
    <div class="item ${s.id === state.current ? "active" : ""}" data-id="${esc(s.id)}">
      <div class="item-t">${esc(s.id)}</div>
      <div class="item-s">${s.turns} turns · seq ${s.last_seq}${s.last_status ? ` · ${esc(s.last_status)}` : ""}</div>
    </div>`).join("") : `<div class="side-empty">还没有会话</div>`;
}
async function openSession(id, opts = {}) {
  state.current = id;
  if (!opts.silent) setIdle("加载中…");
  const data = await api(`/api/sessions/${encodeURIComponent(id)}/events`);
  renderChatFromEvents(data.events || []);
  renderEventsFromHistory(data.events || []);
  await loadSessions();
  if (!opts.silent) setIdle(`会话 ${id} · ${(data.events || []).length} 条事件`);
}

/* ---------------- send ---------------- */
/** 读一条 NDJSON 流：逐帧交给 onFrame；返回末帧（__done / __compact_done …）。 */
async function streamFrames(url, body, onFrame) {
  const res = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  let last = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
      if (!line) continue;
      let frame; try { frame = JSON.parse(line); } catch { continue; }
      if (String(frame.kind).startsWith("__")) last = { kind: frame.kind, payload: frame.payload };
      else { onFrame(frame.kind, frame.payload); appendLiveEvent(frame.kind, frame.payload); }
    }
  }
  return last;
}

/** 手动压缩（/compact）：不跑 turn，只折叠历史；结果以帧到达。 */
async function runCompact() {
  if (state.sending) return;
  if (!state.current) state.current = "default";
  state.sending = true;
  $("send").disabled = true; $("compact-btn").disabled = true;
  removeWorking(); setRunning("正在压缩上下文…");
  ensureWorking("压缩中（会调用一次模型做摘要）…");
  let last = null;
  try {
    last = await streamFrames(`/api/sessions/${encodeURIComponent(state.current)}/compact`, {}, handleFrame);
    removeWorking();
    if (last && last.kind === "__error") setRunline(last.payload.message || "压缩失败", "err");
    else if (last && last.kind === "__compact_noop") setIdle("没有可压缩的历史（只有当前一轮）");
    else if (last && last.kind === "__compact_done") {
      const before = fmtTokens(last.payload.before_tokens), after = fmtTokens(last.payload.after_tokens);
      setIdle(`✓ 压缩完成：折叠 ${last.payload.folded} 条`
        + (before && after ? `（约 ${before} → ${after} tokens）` : ""));
    } else setIdle("压缩完成");
  } catch (err) {
    removeWorking();
    setRunline(`出错：${esc(err.message)}`, "err");
  } finally {
    state.sending = false; $("send").disabled = false; $("compact-btn").disabled = false;
    await openSession(state.current, { silent: true });
  }
}

$("compact-btn").addEventListener("click", runCompact);

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const ta = $("text");
  const text = ta.value.trim();
  if (!text || state.sending) return;
  if (text === "/compact" || text === "/compact ") {       // 斜杠命令：走手动压缩
    ta.value = ""; autosize();
    await runCompact();
    return;
  }
  if (!state.current) state.current = "default";
  state.sending = true; $("send").disabled = true; $("compact-btn").disabled = true;
  ta.value = ""; autosize();
  if (wrapEl.querySelector(".empty")) wrapEl.innerHTML = "";
  wrapEl.appendChild(userNode(text)); scrollBottom();      // 即时反馈（完成后会用日志重渲染）
  wrapEl.querySelectorAll(".cursor").forEach((c) => c.remove());
  setRunning("运行中…");
  ensureWorking("思考中…");
  let done = null;
  try {
    const last = await streamFrames(
      `/api/sessions/${encodeURIComponent(state.current)}/send`, { text }, handleFrame,
    );
    if (last && last.kind === "__done") done = last.payload;
  } catch (err) {
    removeWorking();
    setRunline(`出错：${esc(err.message)}`, "err");
  } finally {
    state.sending = false; $("send").disabled = false; $("compact-btn").disabled = false;
    await openSession(state.current, { silent: true });
    if (done) setIdle(`turn ${done.turn} · ${done.status} · ${done.steps} 步 · 最终回答已渲染`);
    else if (!$("runline").classList.contains("err")) setIdle("就绪");
  }
});

/* ---------------- composer + interactions ---------------- */
const ta = $("text");
function autosize() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 180) + "px"; }
ta.addEventListener("input", autosize);
ta.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
});
chatEl.addEventListener("scroll", () => {
  state.follow = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 90;
});
chatEl.addEventListener("click", async (e) => {
  const hint = e.target.closest(".hint");
  if (hint) { ta.value = hint.dataset.q; autosize(); ta.focus(); return; }
  const apvOk = e.target.closest(".apv-approve");
  if (apvOk) { answerApproval(apvOk.closest(".approval"), true); return; }
  const apvNo = e.target.closest(".apv-deny");
  if (apvNo) { answerApproval(apvNo.closest(".approval"), false); return; }
  const pv = e.target.closest(".preview-btn");
  if (pv) {
    const id = pv.dataset.pre;
    const box = document.getElementById(`pv-${id}`);
    const pre = document.getElementById(id);
    if (!box || !pre) return;
    if (box.hidden) {
      if (!box.dataset.ready) {           // 惰性注入：第一次切换时才构造 iframe
        const frame = document.createElement("iframe");
        // 只给 allow-scripts（不给 allow-same-origin）：脚本能在里面跑，
        // 但拿不到父页面的 DOM / cookie —— 渲染模型给的 HTML 的安全底线。
        frame.setAttribute("sandbox", "allow-scripts");
        frame.className = "preview-frame";
        frame.srcdoc = previewSrc(id);
        box.appendChild(frame);
        box.dataset.ready = "1";
      }
      box.hidden = false; pre.hidden = true; pv.textContent = "源码";
    } else {
      box.hidden = true; pre.hidden = false; pv.textContent = "预览";
    }
    return;
  }
  const btn = e.target.closest(".copy");
  if (btn) {
    const pre = document.getElementById(btn.dataset.pre);
    if (!pre) return;
    try { await navigator.clipboard.writeText(pre.textContent);
      btn.textContent = "已复制"; setTimeout(() => (btn.textContent = "复制"), 1200);
    } catch { btn.textContent = "复制失败"; }
  }
});
sessionsEl.addEventListener("click", (e) => {
  const item = e.target.closest(".item");
  if (item) openSession(item.dataset.id);
});
$("new-session").addEventListener("click", () => {

});
$("toggle-left").addEventListener("click", () => {
  document.body.classList.toggle("no-left");
  $("toggle-left").classList.toggle("on", !document.body.classList.contains("no-left"));
});
$("toggle-right").addEventListener("click", () => {
  document.body.classList.toggle("no-right");
  $("toggle-right").classList.toggle("on", !document.body.classList.contains("no-right"));
});

/* ---------------- 上下文仪表：context-meter 插件的挂载点 ----------------
   与 token 面板同一套契约（URL 参数 → 全局变量 → endpoints 自报 → 默认端口）。
   按钮上的数字 = 用量占比（读 /api/context，跨源靠服务端 CORS）。        */
(function () {
  const btn = document.getElementById("ctx-btn");
  const panel = document.getElementById("ctx-panel");
  const frame = document.getElementById("ctx-frame");
  const urlEl = document.getElementById("ctx-url");
  const openEl = document.getElementById("ctx-open");
  const closeEl = document.getElementById("ctx-close");
  if (!btn || !panel || !frame) return;

  const fromQuery = new URLSearchParams(location.search).get("context_meter");
  let base = String(fromQuery || window.CONTEXT_METER_URL || "http://127.0.0.1:8768/");
  if (!/^https?:\/\//i.test(base)) base = "http://" + base;
  if (!base.endsWith("/")) base += "/";

  function setUrl(url) {
    if (typeof url !== "string" || !/^https?:\/\//i.test(url)) return;
    base = url.endsWith("/") ? url : url + "/";
    urlEl.textContent = base;
    urlEl.title = base;
    openEl.href = base;
    frame.dataset.ready = "";
    if (!panel.hidden) { frame.src = base; frame.dataset.ready = "1"; }
  }

  async function discover() {
    try {
      const res = await fetch("/api/ledger", { cache: "no-store" });
      const data = await res.json();
      setUrl(data && data.endpoints && data.endpoints["context-meter"]);
    } catch (err) { /* 保留当前 base */ }
  }

  async function refreshBadge() {
    try {
      const res = await fetch(base + "api/context", { cache: "no-store" });
      const data = await res.json();
      btn.textContent = "📐 上下文 " + (data.percent ?? 0).toFixed(0) + "%";
      btn.title = "context-meter 插件：已用 " + (data.used ?? 0).toLocaleString("zh-CN")
        + " / " + (data.capacity ?? 0).toLocaleString("zh-CN") + " tokens · " + base;
    } catch (err) {
      btn.textContent = "📐 上下文";
      btn.title = "读不到 " + base + "api/context（插件未装载？点击仍可打开页面）";
    }
  }

  btn.addEventListener("click", async () => {
    panel.hidden = false;
    if (frame.dataset.ready !== "1") {
      await discover();
      frame.src = base;
      frame.dataset.ready = "1";
    }
    refreshBadge();
  });
  closeEl.addEventListener("click", () => { panel.hidden = true; });
  panel.addEventListener("click", (e) => { if (e.target === panel) panel.hidden = true; });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") panel.hidden = true; });

  setUrl(base);
  discover().then(refreshBadge);
  setInterval(refreshBadge, 5000);
})();

/* ---------------- init ---------------- */
(async function init() {
  $("host-badge").textContent = location.host;
  try {
    await Promise.all([loadLedger(), loadSessions()]);
    // 默认打开最近一个会话；没有就停在空态
    const first = sessionsEl.querySelector(".item");
    if (first) await openSession(first.dataset.id, { silent: true });
    else setIdle("就绪 · 点「＋ 新会话」开始");
  } catch (err) {
    setRunline(`初始化失败：${esc(err.message)}`, "err");
  }
  setInterval(loadSessions, 5000);
  setInterval(loadLedger, 2500);
})();
</script>
<script>
"use strict";
/* ---------------- token 用量：token-usage 插件的挂载点 ----------------
   页面不需要认识任何插件：地址按这个顺序解析——
     ① URL 参数 ?token_usage=http://host:port/（手工指定，最优先）
     ② window.TOKEN_USAGE_URL（部署时注入）
     ③ /api/ledger 的 endpoints["token-usage"]（服务自报地址，通用发现）
     ④ 默认 http://127.0.0.1:8767/（token-usage 插件的默认端口）
   按钮上的数字 = 该服务 /api/usage 的合计 tokens（跨源读，靠服务端 CORS 头）；
   点开 = 同页 iframe 面板，不打断对话（Esc / 点空白 / 「关闭」收起）。      */
(function () {
  const btn = document.getElementById("token-btn");
  const panel = document.getElementById("token-panel");
  const frame = document.getElementById("token-frame");
  const urlEl = document.getElementById("token-url");
  const openEl = document.getElementById("token-open");
  const closeEl = document.getElementById("token-close");
  if (!btn || !panel || !frame) return;

  const fromQuery = new URLSearchParams(location.search).get("token_usage");
  let base = String(fromQuery || window.TOKEN_USAGE_URL || "http://127.0.0.1:8767/");
  if (!/^https?:\/\//i.test(base)) base = "http://" + base;
  if (!base.endsWith("/")) base += "/";

  function setUrl(url) {   // 只接受 http(s)：不给 javascript: 之类留任何口子
    if (typeof url !== "string" || !/^https?:\/\//i.test(url)) return;
    base = url.endsWith("/") ? url : url + "/";
    urlEl.textContent = base;
    urlEl.title = base;
    openEl.href = base;
    frame.dataset.ready = "";
    if (!panel.hidden) { frame.src = base; frame.dataset.ready = "1"; }
  }

  async function discover() {   // ③ 服务自报地址（需要 webui 的 /api/ledger 带 endpoints）
    try {
      const res = await fetch("/api/ledger", { cache: "no-store" });
      const data = await res.json();
      setUrl(data && data.endpoints && data.endpoints["token-usage"]);
    } catch (err) { /* 老版本 ledger 没有该字段：用当前 base */ }
  }

  async function refreshBadge() {   // 服务在不在 / 合计多少 tokens
    try {
      const res = await fetch(base + "api/usage", { cache: "no-store" });
      const data = await res.json();
      const total = Number(data.totals.total_tokens || 0).toLocaleString("zh-CN");
      btn.textContent = "📊 Token " + total;
      btn.title = "token-usage 插件：" + data.calls + " 次调用 · 合计 "
        + total + " tokens · " + base;
    } catch (err) {
      btn.textContent = "📊 Token 用量";
      btn.title = "读不到 " + base + "api/usage（插件未装载？点击仍可打开页面）";
    }
  }

  btn.addEventListener("click", async () => {
    panel.hidden = false;
    if (frame.dataset.ready !== "1") {
      await discover();
      frame.src = base;
      frame.dataset.ready = "1";
    }
    refreshBadge();
  });
  closeEl.addEventListener("click", () => { panel.hidden = true; });
  panel.addEventListener("click", (e) => { if (e.target === panel) panel.hidden = true; });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") panel.hidden = true; });

  setUrl(base);
  discover().then(refreshBadge);
  setInterval(refreshBadge, 5000);
})();
</script>
