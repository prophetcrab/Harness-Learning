[project]
name = "mini-harness"
version = "0.2.0"
description = "从一个学习项目长出来的最小 agent harness（P2：M4–M7，阶段式工作区）"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# P2 是阶段式工作区：每个 _0N 目录自带一份完整 harness（自包含）。
# 因此这里不做 setuptools 打包，也不固定 testpaths —— 由 scripts/check.py 逐阶段运行。

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["demo_run", "sessions", "demo_workspace"]

[tool.ruff.lint]
# E/W pycodestyle、F pyflakes、I import 排序、UP pyupgrade、B bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # 行长由 line-length 约束，不逐行报
    "B008",   # 允许在默认参数里调用（如 Field(...)）
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["E402"]   # 测试里允许在 sys.path 引导后再 import

[tool.ruff.lint.isort]
# P2 阶段新增的机制是各阶段目录下的**顶层模块**（如 _01 的 prompt/），与基线 harness 平级。
# 这些名字不是包内子模块，ruff 需显式告知它们属于本项目，才能正确分组。
known-first-party = ["harness", "prompt", "providers", "config", "server"]
